name: Secret Scan

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              with:
                  args: detect --source . --no-banner --redact
