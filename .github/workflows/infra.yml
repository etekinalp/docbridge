name: Infrastructure

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            apply_dev:
                description: Apply the dev Terraform stack after validation
                required: false
                default: false
                type: boolean
            aws_region:
                description: AWS region for the dev apply
                required: false
                default: us-east-1
                type: string
            aws_role_arn:
                description: IAM role ARN to assume for the dev apply
                required: false
                default: arn:aws:iam::123456789012:role/docbridge-github-deploy
                type: string

permissions:
    id-token: write
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.15.8

            - name: Terraform fmt
              run: terraform fmt -check -recursive infra/

            - name: Terraform validate dev
              run: |
                  terraform -chdir=infra/envs/dev init -backend=false
                  terraform -chdir=infra/envs/dev validate

            - name: Terraform validate prod
              run: |
                  terraform -chdir=infra/envs/prod init -backend=false
                  terraform -chdir=infra/envs/prod validate

    apply-dev:
        runs-on: ubuntu-latest
        needs: validate
        if: github.event_name == 'workflow_dispatch' && inputs.apply_dev
        steps:
            - uses: actions/checkout@v4

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.15.8

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ inputs.aws_role_arn }}
                  aws-region: ${{ inputs.aws_region }}

            - name: Terraform apply dev
              run: |
                  terraform -chdir=infra/envs/dev init -backend-config=backend.hcl
                  terraform -chdir=infra/envs/dev apply -auto-approve
