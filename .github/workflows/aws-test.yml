name: Test AWS OIDC Connection

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    aws-oidc-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Authenticate with AWS via OIDC (Native Bash)
              run: |
                  # 1. Fetch GitHub Web Identity OIDC Token
                  OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

                  if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
                    echo "Failed to retrieve GitHub OIDC token"
                    exit 1
                  fi

                  # 2. Decode and print the JWT payload to find the exact mismatch
                  echo "=== DECODED OIDC TOKEN CLAIMS ==="
                  echo "$OIDC_TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson'

                  # 3. Assume Role using AWS CLI
                  echo "Attempting to assume role..."
                  ASSUMED_ROLE=$(aws sts assume-role-with-web-identity \
                    --role-arn "${{ vars.AWS_ROLE_TO_ASSUME }}" \
                    --role-session-name "GitHubActionsSession" \
                    --web-identity-token "$OIDC_TOKEN" \
                    --duration-seconds 900 \
                    --output json)

                  # 4. Export AWS Temporary Credentials
                  echo "AWS_ACCESS_KEY_ID=$(echo $ASSUMED_ROLE | jq -r '.Credentials.AccessKeyId')" >> $GITHUB_ENV
                  echo "AWS_SECRET_ACCESS_KEY=$(echo $ASSUMED_ROLE | jq -r '.Credentials.SecretAccessKey')" >> $GITHUB_ENV
                  echo "AWS_SESSION_TOKEN=$(echo $ASSUMED_ROLE | jq -r '.Credentials.SessionToken')" >> $GITHUB_ENV
                  echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV

            - name: Verify Identity & Access
              run: |
                  aws sts get-caller-identity
