name: Service Images

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - name: user-api
                      dockerfile: services/user-api/Dockerfile
                      image: docbridge-user-api
                    - name: platform-api
                      dockerfile: services/platform-api/Dockerfile
                      image: docbridge-platform-api
                    - name: docbridge-api
                      dockerfile: services/docbridge-api/Dockerfile
                      image: docbridge-docbridge-api

        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push image on main
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.service.dockerfile }}
                  push: true
                  tags: |
                      ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.image }}:${{ github.sha }}
                      ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.image }}:main
